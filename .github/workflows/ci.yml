name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
        with: { run_install: false }
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm catalog:validate

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase start
      - run: supabase test db
      - run: supabase stop

  ml:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - id: changed
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE '^(ml/|packages/recognition/)'; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.changed.outputs.run == 'true'
        uses: astral-sh/setup-uv@v10
        with: { enable-cache: true }
      - if: steps.changed.outputs.run == 'true'
        run: cd ml && uv sync && uv run pytest -q
      - if: steps.changed.outputs.run == 'true'
        run: cd ml && uv run python -m src.eval --release "releases/$(cat releases/LATEST)"

  preview-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'preview-build')
    needs: [quality]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { run_install: false }
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with: { eas-version: latest, token: "${{ secrets.EXPO_TOKEN }}" }
      - run: eas build --profile preview --platform all --non-interactive --no-wait
